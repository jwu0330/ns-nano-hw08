# Render Blueprint: one free PostgreSQL + one free web service in Singapore.
# After the first deploy, load the data once from any machine allowed by the
# database's IP allow list:  python load_db.py --url "<external URL>"
databases:
  - name: ns-nano-hw08-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    databaseName: neurosynth
    user: ns
    ipAllowList: []          # internal access only; add your IP to load data

services:
  - type: web
    name: ns-nano-hw08
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -k uvicorn_worker.UvicornWorker --workers 2 --bind 0.0.0.0:$PORT --timeout 60
    healthCheckPath: /health
    envVars:
      - key: DB_URL
        fromDatabase:
          name: ns-nano-hw08-db
          property: connectionString
